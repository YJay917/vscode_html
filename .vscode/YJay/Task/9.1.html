<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>焦点图布局</title>
 <link rel="stylesheet" href="9.1.css">
</head>
<body>
  <div class="focus-container">
    <!-- 焦点图主体（可替换为实际图片标签 <img>） -->
    <div class="focus-img"></div>
    <!-- 左箭头 -->
    <div class="arrow arrow-left">&lt;</div>
    <!-- 右箭头 -->
    <div class="arrow arrow-right">&gt;</div>
    <!-- 小圆点容器 -->
    <div class="dot-container">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
