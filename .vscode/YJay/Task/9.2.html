<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="9.2.css"> 
  <title>遮罩示例</title>
</head>

<body>
  <!-- 页面主要内容，这里模拟一张背景图或视频等，可替换成实际页面内容 -->
  <div class="page-content">
    <img src="../picture/0I6A9780.jpg" alt="古装场景图"> 
  </div>
  <!-- 遮罩层 -->
  <div class="mask"></div>
  <!-- 遮罩上的内容，比如提示信息、按钮等，按需添加 -->
  <div class="mask-content">
    <p>这是遮罩上的提示文本</p>
    <button>关闭遮罩</button>
  </div>
</body>

</html>
