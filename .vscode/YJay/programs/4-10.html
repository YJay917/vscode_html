
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>学院新闻</title>
  <style>
    /* 全局基础样式 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #f5f5f5;
    }
    a {
      text-decoration: none;
      color: #333;
    }

    /* 顶部第一行（可放欢迎语、快捷链接等） */
    .topbar {
      background-color: #7bd46f;
      height: 36px;
      line-height: 36px;
      font-size: 14px;
      color: #ffffff;
    }
    .topbar .container {
      width: 1200px; /* 可根据需求调整 */
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
 
    .topbar .right-info a {
      margin-left: 15px;
      color: #ffffff;
    }

    /* 顶部 Logo + 标题 */
    header {
      background-color: #fff;
      box-shadow: 5px 5px 10px #ccc;
    }
    .header-container {
      width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }
    /* 左侧 LOGO */
    .logo {
      display: flex;
      align-items: center;
    }
    .logo img {
      width: 150px; /* 根据实际 Logo 尺寸调整 */
      height: 100px;
      margin-right: 10px;
    }
    .site-name {
        font-family: "仿宋";
      font-size: 50px;
      font-weight: none;
      color: #009900; /* 根据需要可自行调整 */
      margin-left: 50px;
    } 

    /* 右侧导航条（主导航） */
    nav.main-nav {
      background-color: #fff;
      border-top: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
    }
    .main-nav .nav-container {
      width: 1200px;
      margin: 0 auto;
      display: flex;
      /* 可以根据需要调整内边距 */
    }
    .main-container {
      width: 1200px;
      margin: 20px auto;
      display: flex;
    }
    .text1{
        writing-mode: vertical-lr;
        line-height: 50px;
        font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- 顶部第一行 -->
  <div class="topbar">
    <div class="container">
        欢迎访问某某学院官网！
      <div class="right-info">
        <a href="#">English</a>
        <a href="#">登录</a>
        <a href="#">联系我们</a>
      </div>
    </div>
  </div>

  <!-- Header：Logo + 标题 -->
  <header>
    <div class="header-container">
      <div class="logo">
        <!-- Logo图片示例，可自行替换 -->
        <img src="./picture/屏幕截图 2025-04-03 151921.png" alt="LOGO">
        <span class="site-name">新闻网</span>
          </div>
          <div class="text1">
            <a href="#">学院新闻</a><hr>
            <a href="#">系部动态</a><hr>
            <a href="#">活动学院</a><hr>
            <a href="#">影院交流</a><hr>
            <a href="#">视觉学院</a><hr>
            <a href="#">播院交流</a><hr>
            <a href="#">媒体学院</a>
    </div>
  </header>

</body>
</html>
