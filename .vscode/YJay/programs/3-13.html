<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四川交通职业技术学院</title>
        <style>
            .header {
                background-color: green;
                color: white;
                display: flex;
                /* 容器，规定元素如何显示，flex布局属性 */
                justify-content: space-around;
                /* 弹性容器 space-around项目周围间隔相等 */
                align-items: center;
                /* 项目在交叉轴上居中对齐 */
                padding: 10px 20px;
                /* 页边距  上下 左右*/
            }
            .left-content p {
                margin: 0;
                /* 外边距 */
            }
            .right-content a {
                color: white;
                text-decoration: none;
                /* 文本装饰效果，去除下划线 */
                margin-right: 10px;
                /* 右边距 */
            }
            .right-content input[type="search"] {
                width: 30px;
                /* 宽度 */
                height: 25px;
                /* 高度 */
                border: none;
                /* 不显示默认下划线 */
                border-radius: 3px;
                /* 元素边框3圆角效果 */
                background-color: inherit;
                color: white;
            }
            .body1{
                margin: 10px;
                display: flex;
                justify-content: space-around;
            }
            .text1{
                margin: 15px;
                text-decoration: none;
                font-size: 1.2em;
            }
            .text1 a {
                text-decoration: none;
                color: rgb(43, 40, 40);
                margin: 10px;
                font-family: 黑体;
                font-weight: bolder;
            } 
            .picture img{
                width: 100%;
                height: 800px;
            }
            
        </style>    
</head>
<body>
    <div class="header">
        <div class="left-content">

        </div>
        <div class="right-content">

    </div>
    <div class="body1">
