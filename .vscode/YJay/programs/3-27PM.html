<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生信息管理系统</title>
</head>
<style>
     body { margin: 0; font-family: Arial;
        background-color: rgb(135, 203, 235); }
     form {background-color: white;
         padding: 20px;
        height: 350px;}
     main { padding: 20px;
         max-width: 400px; 
         margin: 20px auto; }
     .title { font-size: 24px; 
         color: #6091b6;
         font-family: 黑体;
         font-weight: bolder;}
    
    input[type="text1"]{
        width: 280px;
        height: 35px;
        border: 0.5px solid #ccc;
        border-radius: 6px;
        display: flex;
        padding-left: 20px;
        background-image:url("/picture/user.png"); 
        background-repeat:no-repeat;
        background-position:left center;
        padding-right:20px;
        background-size: 16px;
        margin-top: 20px;
        }
     input[type="text2"]{
        align-items: center;
        width: 200px;
        height: 35px;
        border: 0.5px solid #ccc;
        border-radius: 6px;
        display: flex;
        padding-left: 20px;
        margin-left: 20px;
      
     }
     input[type="password"]{
        width: 280px;
        height: 35px;
        border: 0.5px solid #ccc;
        border-radius: 6px;
        display: flex;
        padding-left: 20px;
        background-image:url("/picture/password.png"); 
        background-repeat:no-repeat;
        background-position:left center;
        padding-right:20px;
        background-size: 16px;
        margin-top: 20px;
     }
     select{
        width:320px;
        height: 35px;
        border: 0.5px solid #ccc;
        border-radius: 6px;
        display: flex;
        padding-left: 20px;
        margin-top: 20px;
        margin-bottom: 20px;
     }
     input[type="submit"]{
        width:320px;
        height: 35px;
        border: 0.5px solid #ccc;
        background-color: rgb(70, 187, 77);
        border-radius: 6px;
        display: flex;
        margin-top: 20px;
        font-weight: bolder;
        font-size: 18px;
        color: white;
     }
     .captcha-container {display:flex;
        align-items:center; 
        gap: 10px;
    }
    #captchaCanvas {border:1px solid #ccc;
        border-radius:4px;
        cursor:pointer;
        } 
        
</style> 
<body>
<main>
        <form> 
        <div width="100%" height="100% " align="center" background-color="#000000">
            <label class="title">
                学生信息管理系统
            </label>
                <input  type="text1" placeholder="admin" >
                <input type="password" placeholder="" >
                <select required>
                    <option>请选择</option>
                    <option>普通用户</option>
                    <option>管理员</option>
                    <option>游客</option>
                </select> 
        <div class="captcha-container">
                <input type="text2" placeholder="验证码" id="captchaInput">
                <canvas id="captchaCanvas" width="80" height="40"></canvas>
        </div>
                 <input type="submit" value="登   录">
        </div>

    </main>
    <script>
        function generateCaptcha() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let captcha = '';
  for (let i = 0; i < 4; i++) {
    captcha += chars[Math.floor(Math.random() * chars.length)];
  }
  return captcha;
}

// 绘制验证码到canvas
function drawCaptcha() {
  const canvas = document.getElementById('captchaCanvas');
  const ctx = canvas.getContext('2d');

  // 清空画布
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 生成验证码
  const captcha = generateCaptcha();

  // 绘制背景
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 绘制文字
  ctx.font = '24px Arial';
  ctx.fillStyle = '#333';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(captcha, canvas.width / 2, canvas.height / 2);

  // 添加干扰线
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
    ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
    ctx.strokeStyle = '#999';
    ctx.stroke();
  }

  return captcha;
}

// 初始化验证码
let currentCaptcha = drawCaptcha();

// 点击刷新验证码
document.getElementById('captchaCanvas').addEventListener('click', () => {
  currentCaptcha = drawCaptcha();
});

    </script>
</body>
</html>
