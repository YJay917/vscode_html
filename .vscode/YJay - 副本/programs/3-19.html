<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签</title>
</head>
<body>
    <!-- 链接 -->
    <a href="#" target="_blank">链接</a>
    <!-- 新窗口 -->
    <a href="#" target="_parent">链接</a>
    <!-- 父窗口-->
    <a href="#" target="_self">链接</a>
    <!-- 新当前页面-->
    <a href="#" target="_top">链接</a>
    <!-- 当前窗体打开链接 -->
     <!-- 列表 -->
      <ul>
        <!-- 无序 -->
        <li>
            coffice</li>
        <li>
            milk</li>
      </ul>
                                <ol>
                                    <!-- 有序 -->
                                    <li>
                                        coffice
                                    </li>
                                    <li>
                                        milk
                                    </li>
                                </ol>
                                                        <dl>
                                                            <!-- 自定义 -->
                                                            <dt>
                                                                <!-- 自定义的标题 -->
                                                                milk</dt>
                                                            <dd>
                                                                100</dd>
                                                                <dt>
                                                                    coffce</dt>
                                                                <dd>
                                                                    1000</dd>
                                                        </dl>
</body>
</html>
