<head>
  <meta charset="UTF-8">
  <title>产品卡片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f4f4f4; padding: 20px; }
    .card {
      width: 280px;
      background: #fff;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 15px;
      text-align: center;
    }
    img { width: 100%; height: auto; margin-bottom: 10px; }
    a { text-decoration: none; color: inherit; }
    h2 { font-size: 18px; color: #333; margin-bottom: 8px; }
    p { font-size: 14px; color: #666; margin-bottom: 12px; }
    .price { font-size: 16px; color: #ff6700; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/YJay/picture/airports.png" alt="产品图片">
    <h2><a href="#">REDMI Buds 6 Pro</a></h2>
    <p>小米首发圈瓷同轴三单元 | 55dB深度降噪</p>
    <div class="price">399元起</div>
  </div>
</body>
</html>
