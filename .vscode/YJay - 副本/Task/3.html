<!DOCTYPE html>
<html>
<head>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
form {
  padding: 20px;
  border: 1px solid #ccc;
  border-radius: 5px;
  width: 300px;
}
label {
  display: block;
  margin-bottom: 10px;
}
button {
  margin-top: 10px;
}
h2{
    text-align: center;
}
</style>
</head>
<body>
<form>
    <h2>注册表单</h2>
    <label>姓名: <input type="text"></label><br>
    <label>邮箱: <input type="email"></label><br>
    <label>密码: <input type="password"></label><br>
    
    <label>性别: 
        <input type="radio" name="gender"> 男
        <input type="radio" name="gender"> 女
    </label><br>
    
    <label>地区: 
        <select>
        <option>四川</option>
        <option>北京</option>
        <option>上海</option>
        <option>湖北</option>
            
        </select>
    </label><br>
    <label><input type="checkbox"> 同意条款</label><br>
    <button type="submit">提交</button>
    </form>

</body>
</html>
